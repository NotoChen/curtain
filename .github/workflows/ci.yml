name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain
        run: |
          uname -m
          swift --version

      - name: Test
        run: ./Scripts/test.sh

      - name: Release build
        run: |
          swift build -c release --product curtaind
          swift build -c release --product curtainctl
